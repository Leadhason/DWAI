<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#082621" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#F2F7F6" media="(prefers-color-scheme: light)">
    
    <title>Driftwood AI | Next Gen Voice Infrastructure</title>
    <meta name="description" content="Driftwood AI deploys hyper-realistic Voice Agents that qualify leads, book appointments, and reactivate databases 24/7." />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Sora', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              driftwood: {
                orange: '#F78C36', // Primary Accent
                dark: {
                  bg: '#082621', // Deep Forest Green
                  surface: '#0D3630', // Slightly lighter Teal
                  border: '#1F5249',
                  text: '#A8C2BD', // Muted Teal-Grey
                },
                light: {
                  bg: '#F2F7F6', // Pale Mint
                  surface: '#FFFFFF', // White
                  border: '#D1E0DE',
                  text: '#3A5C56', // Dark Teal Text
                }
              }
            },
            animation: {
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'wave': 'wave 1.2s ease-in-out infinite',
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
            },
            keyframes: {
              wave: {
                '0%, 100%': { height: '10%' },
                '50%': { height: '100%' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #082621; 
      }
      ::-webkit-scrollbar-thumb {
        background: #1F5249; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #F78C36; 
      }
      body, div, nav, button, section {
        transition-property: background-color, border-color, color, box-shadow;
        transition-duration: 300ms;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      html, body {
        overscroll-behavior: none;
      }
      body.modal-open {
        overflow: hidden;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?external=react,react-dom",
    "react-helmet-async": "https://esm.sh/react-helmet-async@2.0.4?external=react,react-dom",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react"
  }
}
</script>
</head>
  <body class="antialiased bg-driftwood-light-bg dark:bg-driftwood-dark-bg">
    <div id="root"></div>
  </body>
</html>
